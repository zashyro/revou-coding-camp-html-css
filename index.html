<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ===== Header ===== -->
    <header>
      <h1 class="app-title">To-Do Life Dashboard</h1>
      <button id="theme-toggle" type="button" aria-label="Toggle theme">🌙</button>
    </header>

    <!-- ===== Main content ===== -->
    <main>

      <!-- Greeting Widget -->
      <section class="widget" id="greeting-widget">
        <h2 class="widget-title">Greeting</h2>
        <p id="clock" aria-live="polite">00:00</p>
        <p id="date"></p>
        <p id="greeting-message"></p>
        <form id="name-form" novalidate>
          <label for="name-input">Your name</label>
          <input
            type="text"
            id="name-input"
            name="name"
            placeholder="Enter your name"
            maxlength="50"
            autocomplete="off"
          />
          <span class="validation-msg" aria-live="polite"></span>
          <button type="submit" class="btn btn-primary">Save</button>
        </form>
      </section>

      <!-- Timer Widget -->
      <section class="widget" id="timer-widget">
        <h2 class="widget-title">Focus Timer</h2>
        <p id="timer-display" aria-live="polite">25:00</p>
        <div id="timer-controls">
          <button type="button" id="timer-start" class="btn btn-primary">Start</button>
          <button type="button" id="timer-stop"  class="btn" disabled>Stop</button>
          <button type="button" id="timer-reset" class="btn">Reset</button>
        </div>
        <p id="timer-complete-msg" role="status" aria-live="polite" style="display:none;">
          ✅ Session complete! Take a break.
        </p>
      </section>

      <!-- To-Do Widget -->
      <section class="widget" id="todo-widget">
        <h2 class="widget-title">To-Do List</h2>
        <form id="todo-form" novalidate>
          <input
            type="text"
            id="todo-input"
            name="task"
            placeholder="Add a new task…"
            autocomplete="off"
          />
          <span class="validation-msg" aria-live="polite"></span>
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <div id="sort-control">
          <label for="sort-select">Sort by</label>
          <select id="sort-select" name="sort">
            <option value="default">Default</option>
            <option value="alpha">A–Z</option>
            <option value="status">Status</option>
          </select>
        </div>
        <ul id="todo-list" aria-label="Task list"></ul>
      </section>

      <!-- Quick Links Widget -->
      <section class="widget" id="links-widget">
        <h2 class="widget-title">Quick Links</h2>
        <form id="link-form" novalidate>
          <label for="link-label-input">Label</label>
          <input
            type="text"
            id="link-label-input"
            name="label"
            placeholder="Link label"
            maxlength="100"
            autocomplete="off"
          />
          <span class="validation-msg" aria-live="polite"></span>

          <label for="link-url-input">URL</label>
          <input
            type="url"
            id="link-url-input"
            name="url"
            placeholder="https://example.com"
            autocomplete="off"
          />
          <span class="validation-msg" aria-live="polite"></span>

          <button type="submit" class="btn btn-primary">Save</button>
        </form>
        <div id="link-grid" aria-label="Saved links"></div>
      </section>

    </main>

    <!-- ===== Footer ===== -->
    <footer>
      <p>Built with ❤️ as part of the RevoU Coding Camp — HTML &amp; CSS module.</p>
    </footer>

    <script src="js/app.js" defer></script>
  </body>
</html>
